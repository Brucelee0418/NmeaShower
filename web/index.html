<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NMEA 分析平台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230f172a'/%3E%3Cpath d='M16 5 L19 16 L16 27 L13 16 Z' fill='%2322c55e'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/plotly.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>NMEA 分析平台</span>
    </div>

    <label class="button" for="file-input">打开 NMEA 文件</label>
    <input id="file-input" type="file" accept=".log,.nmea,.txt,text/plain" multiple hidden />

    <label class="field">
      <span>底图</span>
      <select id="map-style">
        <option value="arcgis-imagery" selected>卫星影像（WGS84）</option>
        <option value="gaode-satellite">高德卫星（GCJ-02 纠偏）</option>
        <option value="gaode-street">高德街道（GCJ-02 纠偏）</option>
        <option value="google-satellite">Google 卫星（Earth，GCJ-02 纠偏）</option>
        <option value="google-street">Google 街道（GCJ-02 纠偏）</option>
        <option value="osm">OpenStreetMap</option>
        <option value="none">无底图</option>
      </select>
    </label>

    <button id="btn-compare" class="button" type="button" aria-pressed="false" title="打开 / 关闭对比曲线浮窗">
      对比曲线
    </button>

    <button id="btn-toolbox" class="button" type="button" aria-expanded="false" aria-controls="toolbox-panel" title="打开工具箱">
      工具箱
    </button>

    <span id="epoch-label" class="epoch-label">未加载数据</span>
  </header>

  <div id="toolbox-panel" class="toolbox-panel" hidden>
    <div class="toolbox-head">工具箱</div>
    <button id="btn-measure" class="toolbox-item" type="button" aria-pressed="false">
      距离测量
    </button>
    <div id="measure-readout" class="toolbox-readout">在地图上点选两点或多点，测量各段与总距离</div>
    <div class="toolbox-actions">
      <button id="measure-undo" type="button" disabled>撤销</button>
      <button id="measure-clear" type="button" disabled>清除</button>
      <button id="measure-done" type="button" disabled>完成</button>
    </div>
  </div>

  <div class="transport">
    <button id="btn-back" class="button icon" type="button" disabled title="后退 1 秒（←）">◀ 1s</button>
    <button id="btn-play" class="button icon play" type="button" disabled title="播放 / 暂停（空格）">▶ 播放</button>
    <button id="btn-fwd" class="button icon" type="button" disabled title="前进 1 秒（→）">1s ▶</button>

    <div class="rate-group" role="group" aria-label="播放倍速">
      <button id="rate-1" class="rate active" type="button" data-rate="1" disabled>1×</button>
      <button id="rate-2" class="rate" type="button" data-rate="2" disabled>2×</button>
    </div>

    <!-- 进度条与时间窗条合二为一：同一条轨道既定位当前时刻，也调整时间窗 -->
    <div id="timeline" class="timeline">
      <div id="timeline-track" class="timeline-track is-empty" role="group"
           aria-label="进度与时间窗：拖动橙色游标定位当前时刻，拖动两端标尺改起止，拖动中间整体平移，点击轨道跳到该时刻">
        <div id="timeline-span" class="timeline-span">
          <div id="timeline-progress" class="timeline-progress"></div>
          <button id="timeline-left" class="timeline-handle left" type="button" role="slider"
                  aria-label="时间窗开始时间" title="拖动调整开始时间（←/→ 微调 1 s，Shift 为 10 s）"></button>
          <button id="timeline-right" class="timeline-handle right" type="button" role="slider"
                  aria-label="时间窗结束时间" title="拖动调整结束时间（←/→ 微调 1 s，Shift 为 10 s）"></button>
        </div>
        <button id="timeline-cursor" class="timeline-cursor hidden" type="button" role="slider"
                aria-label="当前时刻" title="拖动定位当前时刻（点击轨道任意位置也可定位）"></button>
      </div>
      <div class="timeline-marks">
        <span id="time-now">0.0 s</span>
        <span id="timeline-readout">无数据</span>
        <span id="time-total">共 0.0 s</span>
      </div>
    </div>

    <div class="timeline-presets" role="group" aria-label="时间窗预设">
      <button id="timeline-reset" class="preset" type="button" disabled
              title="时间窗恢复全时段">全时段</button>
      <button class="preset" type="button" data-minutes="5" disabled
              title="时间窗设为 5 分钟（以当前时刻为中心）">5 分钟</button>
      <button class="preset" type="button" data-minutes="10" disabled
              title="时间窗设为 10 分钟（以当前时刻为中心）">10 分钟</button>
      <button class="preset" type="button" data-minutes="20" disabled
              title="时间窗设为 20 分钟（以当前时刻为中心）">20 分钟</button>
    </div>
  </div>

  <main>
    <section class="panel map-panel">
      <div id="map" class="plot"></div>
      <svg id="measure-overlay" class="measure-overlay" aria-hidden="true"></svg>
      <div id="map-legend" class="map-legend">
        <div class="legend-head">
          <span class="legend-title">图例 · 样式</span>
          <div class="legend-actions">
            <button id="legend-windows" class="legend-reset" type="button" disabled
                    title="加载数据后可打开星空图与仪表盘">展开窗口</button>
            <button id="legend-reset" class="legend-reset" type="button" title="恢复默认颜色和大小">重置</button>
            <button id="legend-toggle" class="legend-toggle" type="button" aria-expanded="true" title="收起图例">−</button>
          </div>
        </div>
        <div id="legend-datasets" class="legend-datasets"></div>
        <div id="legend-divider" class="legend-divider">图层样式</div>
        <div id="legend-rows" class="legend-rows"></div>
      </div>
      <div id="map-info" class="map-info"></div>
    </section>
  </main>

  <div id="map-drag-label" class="map-drag-label" hidden></div>

  <section id="compare-window" class="compare-window" hidden>
    <header class="compare-head">
      <span class="compare-title">对比曲线</span>
      <div class="compare-actions">
        <button id="compare-zoom-out" class="legend-reset" type="button" title="曲线缩小（滚轮也可缩放）">−</button>
        <button id="compare-zoom-in" class="legend-reset" type="button" title="曲线放大（滚轮也可缩放）">+</button>
        <button id="compare-zoom-reset" class="legend-reset" type="button" title="缩放复位到时间窗范围（双击图表也可复位）">复位</button>
        <button id="compare-reset" class="legend-reset" type="button" title="恢复默认指标、对齐与数据选择">重置配置</button>
        <button id="compare-close" class="legend-toggle" type="button" title="关闭">×</button>
      </div>
    </header>
    <div class="compare-config">
      <div class="compare-config-row">
        <span class="compare-label">指标</span>
        <div id="compare-metrics" class="chips"></div>
      </div>
      <div class="compare-config-row">
        <span class="compare-label">对齐</span>
        <div id="compare-align" class="chips"></div>
      </div>
      <div class="compare-config-row">
        <span class="compare-label">数据</span>
        <div id="compare-datasets" class="chips"></div>
      </div>
    </div>
    <div id="compare-plot" class="compare-plot"></div>
    <div class="compare-hint">滚轮缩放 · 拖拽平移 · 双击复位 · 悬停查看数值 · 点击曲线上的点跳转到该时刻</div>
    <div class="float-resize" title="拖动调整大小"></div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
